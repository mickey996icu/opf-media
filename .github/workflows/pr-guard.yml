# Tamper-proof PR guard: runs the workflow from the BASE branch (pull_request_target),
# never checks out or executes PR code, and only reads the PR file list via the API.
name: pr-guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block non-maintainer changes to CI configuration
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          MAINTAINERS: "mickey996icu"
        run: |
          set -euo pipefail
          for m in $MAINTAINERS; do
            if [ "${PR_AUTHOR,,}" = "${m,,}" ]; then
              echo "Maintainer PR (${PR_AUTHOR}); guard skipped."
              exit 0
            fi
          done
          files="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')"
          blocked="$(printf '%s\n' "$files" | grep -E '^\.github/' || true)"
          if [ -n "$blocked" ]; then
            echo "::error::PRs from non-maintainers must not modify .github/ (workflows, templates, CI config):"
            printf '%s\n' "$blocked"
            exit 1
          fi
          echo "No .github/ changes detected."
