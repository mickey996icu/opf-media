name: Validate Content-Addressed Label Media

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

env:
  OPF_TOOL_REF: "v0.2.3"

permissions:
  contents: read

concurrency:
  group: "media-ci-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout opf-media
        uses: actions/checkout@v4
        with:
          path: opf-media
          fetch-depth: 0

      - name: Checkout open-packaged-food tooling (pinned version)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/open-packaged-food
          path: open-packaged-food
          fetch-depth: 0

      - name: Checkout pinned OPF_TOOL_REF (fallback to main prior to first tag)
        run: |
          if git -C open-packaged-food rev-parse --verify "${OPF_TOOL_REF}" >/dev/null 2>&1; then
            git -C open-packaged-food checkout "${OPF_TOOL_REF}"
          else
            echo "Tag ${OPF_TOOL_REF} not yet created; using default branch."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate PR metadata, file scope & DCO sign-off
        if: github.event_name == 'pull_request'
        run: |
          ./open-packaged-food/bin/opf check-pr-meta \
            --repo-kind media \
            --event-path "$GITHUB_EVENT_PATH" \
            --repo-dir opf-media \
            --base-ref "origin/${{ github.base_ref }}"

      - name: Validate media store (zero external deps)
        run: ./open-packaged-food/bin/opf validate-media --allow-empty opf-media
